<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Trailer overlays</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:ital,wght@0,700;0,800;1,600&display=block">
<style>body{font:14px system-ui;background:#241a33;color:#eee;margin:16px} canvas{display:block;margin:8px 0;background:#888}</style></head>
<body><p id="st">drawing...</p>
<script>
// Draws the trailer's overlays (tools/edit_trailer.py spec -> shots/overlay_spec.json) in the game's own look, scaled for 1920 x 1080:
// the residents' speech bubbles (css/ui.css #plates .say), Lev's dialog box once per typed letter plus the stamped one (#levbox), the title card. Saved to shots/ov_*.png.
const save = async (c, name) => {                                                       // toDataURL is synchronous: toBlob stopped calling back in a background tab
  const u = c.toDataURL('image/png'), bin = atob(u.slice(u.indexOf(',') + 1)), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  for (let i = 0; i < 8; i++) { try { if ((await fetch('/save?name=' + name, { method: 'POST', body: new Blob([a]) })).ok) return; } catch (e) { /* again */ } await new Promise(r => setTimeout(r, 400 * (i + 1))); }
};
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
const rr = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
function wrap(g, text, maxW) { const words = text.split(' '), lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines; }

// ---- speech bubble: #fffaf0, 2.5px #3a2012 border, radius 12, Nunito 700 13px/1.25, max 230px, a tail below; x S
async function bubble(i, text, small) {
  const S = 2.3, pad = [6 * S, 11 * S], font = `700 ${13 * S}px Nunito`, lh = 13 * S * 1.25, maxW = 230 * S - pad[1] * 2, bw = 2.5 * S, tail = 9 * S, sh = 8 * S;
  let g = canvas(10, 10).getContext('2d'); g.font = font; const lines = wrap(g, text, maxW);
  const sf = `italic 600 ${8.5 * S}px Nunito`; g.font = sf; const smallW = small ? g.measureText(small).width : 0; g.font = font;
  const tw = Math.max(...lines.map(l => g.measureText(l).width), smallW), bwid = tw + pad[1] * 2, bh = lines.length * lh + pad[0] * 2 + (small ? 11 * S : 0);
  const c = canvas(bwid + sh * 2, bh + tail + sh * 2); g = c.getContext('2d'); const x0 = sh, y0 = sh * 0.6;
  g.save(); g.shadowColor = 'rgba(10,0,20,.4)'; g.shadowBlur = 6 * S; g.shadowOffsetY = 3 * S; rr(g, x0, y0, bwid, bh, 12 * S); g.fillStyle = '#fffaf0'; g.fill(); g.restore();
  // tail: a square turned 45 degrees, half under the box (border on its two lower sides)
  const tx = x0 + bwid / 2, ty = y0 + bh - 0.5 * S; g.save(); g.translate(tx, ty); g.rotate(Math.PI / 4); g.fillStyle = '#fffaf0'; g.fillRect(-tail / 2, -tail / 2, tail, tail);
  g.strokeStyle = '#3a2012'; g.lineWidth = bw; g.beginPath(); g.moveTo(tail / 2, -tail / 2); g.lineTo(tail / 2, tail / 2); g.lineTo(-tail / 2, tail / 2); g.stroke(); g.restore();
  rr(g, x0, y0, bwid, bh, 12 * S); g.lineWidth = bw; g.strokeStyle = '#3a2012'; g.stroke();
  g.save(); g.translate(tx, ty); g.rotate(Math.PI / 4); g.fillStyle = '#fffaf0'; g.fillRect(-tail / 2 + bw / 2, -tail / 2 - bw * 0.2, tail - bw, tail - bw); g.restore();    // hide the box border inside the tail
  g.fillStyle = '#3a2418'; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, k) => g.fillText(l, x0 + bwid / 2, y0 + pad[0] + lh * (k + 0.5)));
  if (small) { g.font = sf; g.fillStyle = 'rgba(58,36,24,.6)'; g.fillText(small, x0 + bwid / 2, y0 + pad[0] + lh * lines.length + 5.5 * S); }
  await save(c, `ov_bubble_${i}.png`);
}

// ---- Lev's box: #fffaf3, radius 22, face 84 with a white rim and a purple ring, Lev in Fredoka, NIGHT SHIFT, text Nunito 700 16.5/1.4, the red STAMP; x S
async function levBox(i, text, face) {
  const S = 1.6, Wd = 660 * S, padL = 12 * S, padT = 12 * S, padR = 18 * S, padB = 14 * S, fs = 84 * S, gap = 14 * S, tf = `700 ${16.5 * S}px Nunito`, lh = 16.5 * S * 1.4, sh = 28 * S;
  let g = canvas(10, 10).getContext('2d'); g.font = tf; const textX = padL + fs + gap, textW = Wd - textX - padR;
  const stampW = 13 * S * 4.6 + 14 * S;                                                  // room kept on the last line for the stamp
  const linesFull = wrap(g, text + ' XXXXXXX', textW);
  const bh = Math.max(padT + 18 * S * 1.3 + Math.max(2, linesFull.length) * lh + padB, fs + padT + padB);
  const draw = async (n, stamped, name) => {
    const c = canvas(Wd + sh * 2, bh + sh * 2), g = c.getContext('2d'); g.translate(sh, sh * 0.5);
    g.save(); g.shadowColor = 'rgba(40,20,70,.32)'; g.shadowBlur = 28 * S; g.shadowOffsetY = 10 * S; rr(g, 0, 0, Wd, bh, 22 * S); g.fillStyle = '#fffaf3'; g.fill(); g.restore();
    rr(g, 0, 0, Wd, bh, 22 * S); g.lineWidth = 1.5 * S; g.strokeStyle = 'rgba(58,36,96,.22)'; g.stroke();
    // face
    const cx = padL + fs / 2, cy = padT + fs / 2;
    g.beginPath(); g.arc(cx, cy, fs / 2 + 2 * S, 0, Math.PI * 2); g.fillStyle = '#7a3ac8'; g.fill();
    g.beginPath(); g.arc(cx, cy, fs / 2, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill();
    g.save(); g.beginPath(); g.arc(cx, cy, fs / 2 - 3 * S, 0, Math.PI * 2); g.clip(); g.fillStyle = '#cbbbe8'; g.fillRect(cx - fs / 2, cy - fs / 2, fs, fs); if (face) g.drawImage(face, cx - fs / 2 + 3 * S, cy - fs / 2 + 3 * S, fs - 6 * S, fs - 6 * S); g.restore();
    // name
    g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.font = `600 ${18 * S}px Fredoka`; g.fillStyle = '#5a24a8'; const ny = padT + 18 * S; g.fillText('Lev', textX, ny);
    const nw = g.measureText('Lev').width; g.font = `800 ${12 * S}px Nunito`; g.fillStyle = 'rgba(43,33,64,.6)'; if ('letterSpacing' in g) g.letterSpacing = `${0.03 * 12 * S}px`; g.fillText('NIGHT SHIFT', textX + nw + 8 * S, ny); if ('letterSpacing' in g) g.letterSpacing = '0px';
    // text, typed up to n characters (the wrap is the full line's, so words never jump)
    g.font = tf; g.fillStyle = '#2b2140'; let left = n, y = ny + 4 * S, lastEnd = textX;
    const lines = wrap(g, text, textW - stampW * 0);
    for (const l of lines) { y += lh; if (left <= 0) break; const part = l.slice(0, left); g.fillText(part, textX, y - lh * 0.22); lastEnd = textX + g.measureText(part).width; left -= l.length + 1; }
    if (stamped) {                                                                        // STAMP, a little rotated, after the last word (or on a new line when it does not fit)
      g.font = `800 ${13 * S}px Nunito`; if ('letterSpacing' in g) g.letterSpacing = `${0.12 * 13 * S}px`; const sw = g.measureText('STAMP').width + 14 * S, shh = 13 * S * 1.45;
      let sx = lastEnd + 8 * S, sy = y - lh * 0.22 - shh * 0.78; if (sx + sw > textX + textW) { sx = textX; sy += lh; }
      g.save(); g.translate(sx + sw / 2, sy + shh / 2); g.rotate(-5 * Math.PI / 180); g.globalAlpha = 0.85; g.strokeStyle = '#b8283f'; g.lineWidth = 2 * S; rr(g, -sw / 2, -shh / 2, sw, shh, 4 * S); g.stroke();
      g.fillStyle = '#b8283f'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('STAMP', 0.06 * 13 * S, 1 * S); g.restore(); if ('letterSpacing' in g) g.letterSpacing = '0px';
    }
    await save(c, name);
  };
  for (let n = 0; n <= text.length; n++) await draw(n, false, `ov_lev_${i}_${n}.png`);
  await draw(text.length, true, `ov_lev_${i}_s.png`);
}

async function title() {
  const c = canvas(1920, 1080), g = c.getContext('2d'); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(20,8,40,0.8)'; g.shadowBlur = 40; g.fillStyle = '#fff'; g.font = '700 190px Fredoka'; g.fillText('Chog Hotel', 960, 470);
  g.shadowBlur = 20; g.font = '600 58px Fredoka'; g.fillStyle = '#f3e8ff'; g.fillText('Check in. Never check out.', 960, 630);
  g.font = '600 38px Fredoka'; g.fillStyle = 'rgba(255,255,255,0.92)'; g.fillText('Free to play   ·   chog-hotel.pages.dev', 960, 960);
  await save(c, 'ov_title.png');
}

(async () => {
  for (const f of ['700 30px Nunito', '800 30px Nunito', 'italic 600 20px Nunito', '600 30px Fredoka', '700 30px Fredoka']) await document.fonts.load(f);
  const spec = await (await fetch('shots/overlay_spec.json?' + Date.now())).json();
  const face = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = 'shots/lev_face.png'; });
  for (let i = 0; i < spec.bubbles.length; i++) await bubble(i, spec.bubbles[i].text, spec.bubbles[i].small);
  for (let i = 0; i < spec.levs.length; i++) await levBox(i, spec.levs[i], face);
  await title();
  document.getElementById('st').textContent = 'done: ' + spec.bubbles.length + ' bubbles, ' + spec.levs.length + ' Lev lines';
  window.__done = true;
})();
</script></body></html>
