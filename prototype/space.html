<script>
  { const d = Object.assign({}, SPACE.LAYOUTS[QS.get('layout') || 'studio']); if (QS.get('view')) d.view = QS.get('view'); SPACE.build(d); }
  const people = [[{ hair: 0x5b35b0 }, 2.9, -2.2, 0.4, 1.08], [{ hair: 0xff4a98, outfit: 'jacket', trim: 0x60e0f0, head: 'headset' }, 1.6, 2.7, -2.4, 1], [{ hair: 0xf4c82c, outfit: 'vest', vest: 0x3a8a6a }, -1.2, 0.2, 0.8, 1]];
  for (const [o, x, z, ry, s] of people) { const c = chog(Object.assign({ scale: CHOG_SCALE * s }, o)); c.position.set(x, 0, z); c.rotation.y = ry; world.add(c); }
  SPACE.refreshHidden();
  FW = +(QS.get('zoom') || 20); camTarget.set(0.2, 0.9, 0.2); updateCam();
